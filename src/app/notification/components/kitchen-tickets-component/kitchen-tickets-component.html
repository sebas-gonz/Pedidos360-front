@if (tickets.length > 0) {
    <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border-left: 5px solid #ffc107; margin-bottom: 20px;">
        <h3 style="margin-top: 0; color: #856404;">Nuevos pedidos</h3>

        <div style="display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;">
            @for (ticket of tickets; track ticket.orderUuid) {
                <div style="background: white; border: 1px dashed #ccc; padding: 15px; min-width: 250px; box-shadow: 2px 2px 5px rgba(0,0,0,0.05);">
                    <div style="font-weight: bold; border-bottom: 1px solid #eee; margin-bottom: 10px; padding-bottom: 5px;">
                        Orden: {{ ticket.orderUuid | slice:0:8 }}...
                    </div>
                    <ul style="margin: 0; padding-left: 20px; font-size: 14px; margin-bottom: 10px;">
                        @for (item of ticket.items; track item.productName) {
                            <li>{{ item.quantity }}x {{ item.productName }}</li>
                        }
                    </ul>
                    <button (click)="removeTicket(ticket.orderUuid)" style="font-size: 12px; background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
                        Quitar
                    </button>
                </div>
            }
        </div>
    </div>
}
